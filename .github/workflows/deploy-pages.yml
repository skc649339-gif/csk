name: Publish reviewed CSK build to GitHub Pages
# Manual production publication only. See docs/DEPLOYMENT_SAFETY_ROUND4.md.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '输入 PUBLISH_CSK，确认本次操作将覆盖生产网站'
        required: true
        type: string
      expected_sha:
        description: '粘贴已独立审核、已提交的完整 40 位 Git SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'skc649339-gif/csk' && github.ref == 'refs/heads/feature/iphone-pwa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify explicit release approval and exact checkout
        env:
          CSK_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          CSK_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/check-release.mjs
      - name: Derive Pages base path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repo_name,,}" == "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            base_path=''
          else
            base_path="/$repo_name"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io$base_path" >> "$GITHUB_ENV"
          echo 'NEXT_TELEMETRY_DISABLED=1' >> "$GITHUB_ENV"
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:local
      - run: npm run test:engine
      - run: npm run build
      - run: npm run test:pwa
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.repository == 'skc649339-gif/csk' && github.ref == 'refs/heads/feature/iphone-pwa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
