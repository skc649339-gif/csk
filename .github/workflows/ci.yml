name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Ordinary pushes and PRs can check/build, never deploy Pages.
permissions:
  contents: read

jobs:
  check:
    name: 类型检查、数据保护与 PWA 回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Derive Pages base path for checks
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repo_name,,}" == "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            base_path=''
          else
            base_path="/$repo_name"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io$base_path" >> "$GITHUB_ENV"
          echo 'NEXT_TELEMETRY_DISABLED=1' >> "$GITHUB_ENV"
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:local
      - run: npm run test:engine
      - run: npm run build
      - run: npm run test:pwa
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
